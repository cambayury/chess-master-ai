workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chessmasteria.chessmasteria
      vars:
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Patch Stockfish NNUE paths to absolute
        script: |
          mkdir -p $HOME/nnue
          curl -L -o $HOME/nnue/nn-c288c895ea92.nnue "https://tests.stockfishchess.org/api/nn/nn-c288c895ea92.nnue"
          curl -L -o $HOME/nnue/nn-37f18f62d772.nnue "https://tests.stockfishchess.org/api/nn/nn-37f18f62d772.nnue"
          EVAL_HEADER=$(find $HOME/.pub-cache -path "*stockfish*/ios/Stockfish/src/evaluate.h" | head -1)
          sed -i '' "s|\"nn-c288c895ea92.nnue\"|\"$HOME/nnue/nn-c288c895ea92.nnue\"|" "$EVAL_HEADER"
          sed -i '' "s|\"nn-37f18f62d772.nnue\"|\"$HOME/nnue/nn-37f18f62d772.nnue\"|" "$EVAL_HEADER"
      - name: Flutter build ipa
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa